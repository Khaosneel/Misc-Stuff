<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta charset="UTF-8">
<title>2D Adventure Game</title>
<style>
html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    touch-action:none;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:clamp(18px,4vw,32px);
    font-weight:bold;
    text-shadow:2px 2px 4px black;
}

#controls{
    position:fixed;
    bottom:20px;
    left:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    padding:0 20px;
    box-sizing:border-box;
    z-index:100;
}

#controls button{
    width:90px;
    height:90px;
    border:none;
    border-radius:50%;
    font-size:40px;
    background:rgba(255,255,255,0.8);
    color:black;
    touch-action:none;
    user-select:none;
}

#jumpBtn{
    margin:auto;
}
</style>
</head>
<body>

<div id="ui">Lives: 3</div>
<canvas id="game"></canvas>
<div id="controls">
    <button id="leftBtn">◀</button>
    <button id="jumpBtn">▲</button>
    <button id="rightBtn">▶</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const ui = document.getElementById("ui");

function resizeCanvas(){

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange",resizeCanvas);

const GRAVITY = 0.8;
const WORLD_WIDTH = 5000;

const keys = {};

document.addEventListener("keydown", e=>{
    keys[e.code] = true;
});

document.addEventListener("keyup", e=>{
    keys[e.code] = false;
});

const leftBtn = document.getElementById("leftBtn");
const rightBtn = document.getElementById("rightBtn");
const jumpBtn = document.getElementById("jumpBtn");

function bindButton(button, key){

    button.addEventListener("touchstart", e=>{
        e.preventDefault();
        keys[key] = true;
    });

    button.addEventListener("touchend", e=>{
        e.preventDefault();
        keys[key] = false;
    });

    button.addEventListener("touchcancel", e=>{
        e.preventDefault();
        keys[key] = false;
    });

    button.addEventListener("mousedown", ()=>{
        keys[key] = true;
    });

    button.addEventListener("mouseup", ()=>{
        keys[key] = false;
    });

    button.addEventListener("mouseleave", ()=>{
        keys[key] = false;
    });
}

bindButton(leftBtn,"ArrowLeft");
bindButton(rightBtn,"ArrowRight");
bindButton(jumpBtn,"Space");

const player = {
    x:100,
    y:300,
    w:40,
    h:50,
    vx:0,
    vy:0,
    speed:5,
    jumpPower:-15,
    onGround:false,
    lives:3
};

const platforms = [
    {x:0,y:480,w:800,h:60},
    {x:900,y:480,w:900,h:60},
    {x:1900,y:480,w:1000,h:60},
    {x:3000,y:480,w:1200,h:60},
    {x:4300,y:480,w:700,h:60},

    {x:500,y:350,w:100,h:25},
    {x:700,y:300,w:100,h:25},
    {x:1200,y:330,w:150,h:25},
    {x:1600,y:280,w:150,h:25},
    {x:2500,y:330,w:150,h:25},
    {x:3300,y:280,w:150,h:25}
];

const blocks = [
    {x:600,y:250,w:50,h:50},
    {x:650,y:250,w:50,h:50},
    {x:700,y:250,w:50,h:50},

    {x:1400,y:200,w:50,h:50},
    {x:1450,y:200,w:50,h:50},
    {x:1500,y:200,w:50,h:50},

    {x:2800,y:250,w:50,h:50},
    {x:2850,y:250,w:50,h:50}
];

const pipes = [
    {x:1000,y:380,w:80,h:100},
    {x:2100,y:330,w:90,h:150},
    {x:3600,y:280,w:100,h:200}
];

const enemies = [
    {x:800,y:440,w:40,h:40,vx:2,min:750,max:1000},
    {x:1500,y:440,w:40,h:40,vx:2,min:1450,max:1700},
    {x:2400,y:440,w:40,h:40,vx:2,min:2350,max:2600},
    {x:3400,y:440,w:40,h:40,vx:2,min:3300,max:3600}
];

let cameraX = 0;
let gameOver = false;

function rectsIntersect(a,b){
    return (
        a.x < b.x+b.w &&
        a.x+a.w > b.x &&
        a.y < b.y+b.h &&
        a.y+a.h > b.y
    );
}

function respawn(){
    player.x = 100;
    player.y = 300;
    player.vx = 0;
    player.vy = 0;
}

function loseLife(){
    player.lives--;
    ui.textContent = "Lives: " + player.lives;

    if(player.lives <= 0){
        gameOver = true;
    } else {
        respawn();
    }
}

function updatePlayer(){

    player.vx = 0;

    if(keys["ArrowLeft"]){
        player.vx = -player.speed;
    }

    if(keys["ArrowRight"]){
        player.vx = player.speed;
    }

    if((keys["Space"] || keys["ArrowUp"]) && player.onGround){
        player.vy = player.jumpPower;
    }

    player.vy += GRAVITY;

    player.x += player.vx;

    const solids = [...platforms,...blocks,...pipes];

    for(const s of solids){
        if(rectsIntersect(player,s)){
            if(player.vx > 0){
                player.x = s.x - player.w;
            }
            if(player.vx < 0){
                player.x = s.x + s.w;
            }
        }
    }

    player.y += player.vy;
    player.onGround = false;

    for(const s of solids){

        if(rectsIntersect(player,s)){

            if(player.vy > 0){
                player.y = s.y - player.h;
                player.vy = 0;
                player.onGround = true;
            }
            else if(player.vy < 0){
                player.y = s.y + s.h;
                player.vy = 0;
            }
        }
    }

    if(player.y > 700){
        loseLife();
    }

    if(player.x < 0){
        player.x = 0;
    }

    if(player.x > WORLD_WIDTH-player.w){
        player.x = WORLD_WIDTH-player.w;
    }
}

function updateEnemies(){

    for(let i = enemies.length - 1; i >= 0; i--){

        const e = enemies[i];

        e.x += e.vx;

        if(e.x < e.min || e.x > e.max){
            e.vx *= -1;
        }

        if(rectsIntersect(player,e)){

            const playerBottom = player.y + player.h;

            if(
                player.vy > 0 &&
                playerBottom - player.vy <= e.y + 10
            ){
                // Stomp enemy
                enemies.splice(i,1);

                // Bounce
                player.vy = -10;
            }
            else{
                loseLife();
                return;
            }
        }
    }
}

function updateCamera(){
    cameraX = player.x - canvas.width/2;

    if(cameraX < 0){
        cameraX = 0;
    }

    if(cameraX > WORLD_WIDTH-canvas.width){
        cameraX = WORLD_WIDTH-canvas.width;
    }
}

function drawGroundPattern(){

    ctx.fillStyle = "#d99a50";

    for(let x=0;x<WORLD_WIDTH;x+=50){
        ctx.fillRect(x-cameraX,480,50,60);
    }
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawGroundPattern();

    for(const p of platforms){
        ctx.fillStyle="#8B4513";
        ctx.fillRect(
            p.x-cameraX,
            p.y,
            p.w,
            p.h
        );
    }

    for(const b of blocks){
        ctx.fillStyle="#c96b2c";
        ctx.fillRect(
            b.x-cameraX,
            b.y,
            b.w,
            b.h
        );
    }

    for(const p of pipes){
        ctx.fillStyle="#2ecc40";
        ctx.fillRect(
            p.x-cameraX,
            p.y,
            p.w,
            p.h
        );
    }

    for(const e of enemies){
        ctx.fillStyle="#8b0000";
        ctx.fillRect(
            e.x-cameraX,
            e.y,
            e.w,
            e.h
        );
    }

    ctx.fillStyle="#ff4444";
    ctx.fillRect(
        player.x-cameraX,
        player.y,
        player.w,
        player.h
    );

    drawClouds();

    if(gameOver){

        ctx.fillStyle="rgba(0,0,0,0.7)";
        ctx.fillRect(0,0,canvas.width,canvas.height);

        ctx.fillStyle="white";
        ctx.font="64px Arial";
        ctx.textAlign="center";
        ctx.fillText(
            "GAME OVER",
            canvas.width/2,
            canvas.height/2
        );
    }
}

function drawClouds(){

    ctx.fillStyle="white";

    const clouds = [
        [200,100],
        [900,120],
        [1600,90],
        [2600,140],
        [3800,110]
    ];

    for(const c of clouds){

        const x = c[0]-cameraX;
        const y = c[1];

        ctx.beginPath();
        ctx.arc(x,y,25,0,Math.PI*2);
        ctx.arc(x+25,y,25,0,Math.PI*2);
        ctx.arc(x+50,y,25,0,Math.PI*2);
        ctx.fill();
    }
}

function gameLoop(){

    if(!gameOver){
        updatePlayer();
        updateEnemies();
        updateCamera();
    }

    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
